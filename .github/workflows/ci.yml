name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      # Parcel can segfault on exit on Linux after a successful build (same
      # reason netlify.toml checks for dist/index.html), so judge the build
      # by its output rather than its exit code. CI starts with no dist/,
      # so a real build failure still fails this step.
      - name: Production build
        run: |
          npm run build || echo "parcel exited with $?"
          test -f dist/index.html
